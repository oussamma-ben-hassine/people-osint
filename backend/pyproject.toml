[project]
name = "people-osint-backend"
version = "1.0.0"
description = "People OSINT — Multi-source knowledge engine, investigation library & AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.3",
    "pgvector>=0.3.5",
    "httpx>=0.27.2",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "reportlab>=4.2.5",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "app"]
asyncio_mode = "auto"

